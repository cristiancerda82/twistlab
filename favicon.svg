<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Twistlab">
    <!-- Una cara de cubo, con los colores reales del puzzle. En SVG para que
         se vea nítida en cualquier tamaño de pestaña. -->
    <rect width="64" height="64" rx="12" fill="#0f1115"/>
    <g>
        <rect x="8"  y="8"  width="15" height="15" rx="3" fill="#b71234"/>
        <rect x="24.5" y="8"  width="15" height="15" rx="3" fill="#f5f5f5"/>
        <rect x="41" y="8"  width="15" height="15" rx="3" fill="#009b48"/>
        <rect x="8"  y="24.5" width="15" height="15" rx="3" fill="#ffd500"/>
        <rect x="24.5" y="24.5" width="15" height="15" rx="3" fill="#009b48"/>
        <rect x="41" y="24.5" width="15" height="15" rx="3" fill="#0046ad"/>
        <rect x="8"  y="41" width="15" height="15" rx="3" fill="#ff5800"/>
        <rect x="24.5" y="41" width="15" height="15" rx="3" fill="#b71234"/>
        <rect x="41" y="41" width="15" height="15" rx="3" fill="#f5f5f5"/>
    </g>
</svg>
